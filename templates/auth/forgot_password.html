{% extends "auth/base_auth.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-header" style="text-align:center">
  <h1>Reset your password</h1>
  <p>Enter your email and, if an account matches, we will send a reset link.</p>
</div>
<form method="POST">
  <div class="form-group">
    <label class="form-label" for="email">Email Address</label>
    <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
  </div>
  <button class="btn btn-primary w-full btn-lg" type="submit">Send reset link</button>
</form>
<div class="auth-footer"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
{% endblock %}

{% extends "auth/base_auth.html" %}
{% block title %}Choose a New Password{% endblock %}
{% block content %}
<div class="auth-header" style="text-align:center">
  <h1>Choose a new password</h1>
  <p>Use at least 8 characters with uppercase, lowercase, a number, and a special character.</p>
</div>
<form method="POST">
  <div class="form-group">
    <label class="form-label" for="password">New Password</label>
    <input class="form-control" id="password" name="password" type="password" required autocomplete="new-password">
  </div>
  <div class="form-group">
    <label class="form-label" for="confirm_password">Confirm New Password</label>
    <input class="form-control" id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
  </div>
  <button class="btn btn-primary w-full btn-lg" type="submit">Reset password</button>
</form>
{% endblock %}
